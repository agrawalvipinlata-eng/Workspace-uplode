plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// ═══ FIREBASE — auto-applies once android/app/google-services.json exists
// (that file is generated by `flutterfire configure`). Until then the build
// still works, so you can build before AND after Firebase setup.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
} else {
    logger.warn("NOTE: google-services.json not found — Firebase disabled for this build. Run `flutterfire configure` (see docs/FIREBASE_SETUP_HINDI.md).")
}

// Reads the Google Maps key from android/local.properties (never committed).
// (Maps: OpenStreetMap — no key needed)
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

android {
    namespace = "com.srbs.never_miss_bus"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        // REQUIRED by flutter_local_notifications v17+ — without this the
        // app crashes instantly in release mode (black screen).
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.srbs.never_miss_bus"
        // firebase_auth / cloud_firestore need at least 23; maps needs 21+.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true

    }

    buildTypes {
        release {
            // ═══ PRODUCTION SIGNING — create android/key.properties and a
            // proper signing config before publishing. Debug signing is used
            // here only so `flutter run --release` works during development.
            signingConfig = signingConfigs.debug
            // NOTE: R8 minification disabled for this CI build environment
            // (2 GB RAM). Re-enable minifyEnabled/shrinkResources for the
            // final Play Store build on a normal dev machine.
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Java 8+ API desugaring (required by flutter_local_notifications v17+)
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.2"
}
